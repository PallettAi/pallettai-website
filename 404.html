<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    GitHub Pages cannot rewrite URLs, so it serves this file for ANY unknown
    path. That gives us two jobs:

    1. pallettai.org/ref/CODE  → hand the code to ref.html (?code= form)
    2. pallettai.org/auth/...  → Supabase emails confirmation/reset links
       that point at the Site URL. This script completes the flow right here:
       confirm the email, or set a new password — no app needed.
  -->
  <script>
    (function () {
      var SUPABASE_URL = 'https://fjahxichioccknszuxhb.supabase.co';
      var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqYWh4aWNoaW9jY2tuc3p1eGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDk0MjUsImV4cCI6MjEwNDA4NTQyNX0.n1NMO7W5StuAAIxIZh2ZnMuM6qJqytKQaOUIav4aDm4';

      // ---- 1. referral invite links: /ref/CODE -------------------------------
      var m = location.pathname.match(/\/ref\/([A-Za-z0-9-]+)/);
      if (m) {
        var base = location.pathname.split('/ref/')[0].replace(/\/+$/, '');
        var code = m[1].toUpperCase().replace(/[^A-Z0-9]/g, '');
        location.replace(base + '/ref.html?code=' + code);
        return;
      }

      // ---- 2. Supabase auth links: /auth/confirm?... -------------------------
      function handleAuth() {
        if (!/^\/auth\//.test(location.pathname)) return;
        var box = document.getElementById('page-404');
        var ui = document.getElementById('auth-ui');
        if (box) box.style.display = 'none';
        if (ui) ui.style.display = 'block';
        else return;

        var statusEl = document.getElementById('auth-status');
        var okBtn = document.getElementById('auth-ok-btn');
        var formBox = document.getElementById('auth-form-box');
        function status(msg, ok) {
          statusEl.textContent = msg;
          statusEl.style.color = ok ? '#7ce38b' : '#ff8f8f';
          if (okBtn) okBtn.style.display = ok ? 'inline-block' : 'none';
        }

        var p = new URLSearchParams(location.search);
        var tokenHash = p.get('token_hash');
        var type = p.get('type') || 'email';
        var token = p.get('token');

        if (!tokenHash && !token) { status('This link is missing its verification code.', false); return; }

        status('Verifying…', false);
        (async function () {
          try {
            var body = tokenHash
              ? { type: type, token_hash: tokenHash }
              : { type: type, token: token };
            var r = await fetch(SUPABASE_URL + '/auth/v1/verify', {
              method: 'POST',
              headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            var j = await r.json();
            if (!r.ok || !j || j.error) throw new Error('verify failed');

            if (type === 'recovery') {
              // verification returned a session → let them pick a new password
              sessionStorage.setItem('pallettai.reset.token', j.access_token);
              status('Verify your email then set a new password:', false);
              formBox.style.display = 'block';
              return;
            }
            status('✓ All set — your email is confirmed. You can now sign in.', true);
            okBtn.href = '/ref.html';
            okBtn.textContent = 'Continue to sign in';
          } catch (e) {
            status('This link is invalid or has expired. Close this tab and request a fresh one (resend the confirmation email, or use “forgot password” in the app).', false);
          }
        })();

        var pwBtn = document.getElementById('auth-pw-btn');
        var pwMsg = document.getElementById('auth-pw-msg');
        if (pwBtn) pwBtn.addEventListener('click', async function () {
          var pw = document.getElementById('auth-pw').value;
          var pw2 = document.getElementById('auth-pw2').value;
          pwMsg.textContent = '';
          if (pw.length < 8) { pwMsg.textContent = 'Password must be at least 8 characters.'; return; }
          if (pw !== pw2) { pwMsg.textContent = 'Passwords do not match.'; return; }
          var tok = sessionStorage.getItem('pallettai.reset.token');
          if (!tok) { pwMsg.textContent = 'Session expired — close this tab and request the reset link again.'; return; }
          pwBtn.disabled = true;
          try {
            var r = await fetch(SUPABASE_URL + '/auth/v1/user', {
              method: 'PUT',
              headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: pw })
            });
            var j = await r.json();
            if (!r.ok || j.error) throw new Error(j.msg || 'update failed');
            sessionStorage.removeItem('pallettai.reset.token');
            formBox.style.display = 'none';
            status('✓ Password updated. You can now sign in on the PallettAI Studio app.', true);
            okBtn.href = '/ref.html';
            okBtn.textContent = 'Go to sign in';
          } catch (e) {
            pwMsg.textContent = e.message || 'Something went wrong — please try again.';
          } finally {
            pwBtn.disabled = false;
          }
        });
      }

      // the script lives in <head>, so wait for the body to exist before
      // touching the DOM (the /ref/ redirect above runs immediately instead)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', handleAuth);
      } else {
        handleAuth();
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0612;
      --ink: #f4f1fa;
      --muted: rgba(244, 241, 250, 0.7);
      --faint: rgba(244, 241, 250, 0.45);
      --line: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.06);
      --violet-soft: #c296ff;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(700px 500px at 78% 10%, rgba(139, 92, 246, 0.18), transparent 62%),
                  radial-gradient(560px 420px at 10% 92%, rgba(91, 43, 179, 0.14), transparent 62%),
                  var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--ink);
      text-align: center;
      padding: 32px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(70px); animation: drift 11s ease-in-out infinite; }
    .orb.one { width: 420px; height: 420px; top: -120px; right: -80px; background: rgba(139, 92, 246, 0.22); }
    .orb.two { width: 340px; height: 340px; bottom: -120px; left: -90px; background: rgba(91, 43, 179, 0.18); animation-delay: -5s; }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
    .card {
      position: relative; z-index: 1; max-width: 560px; padding: 56px 44px; margin: auto;
      border: 1px solid var(--line); border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: rise 0.9s var(--ease) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(0.98); } to { opacity: 1; transform: none; } }
    .code {
      font-size: clamp(88px, 18vw, 132px); font-weight: 700; letter-spacing: -0.05em; line-height: 1;
      background: var(--grad-title); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 14px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
    p { margin: 12px auto 0; max-width: 380px; font-size: 15px; line-height: 1.6; color: var(--muted); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
    .button {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.25s, border-color 0.25s;
    }
    .button.primary { background: linear-gradient(135deg, #8b5cf6, #5b2bb3); color: #fff; box-shadow: 0 8px 32px rgba(122, 77, 209, 0.4); }
    .button.primary:hover { transform: scale(1.03); box-shadow: 0 10px 44px rgba(139, 92, 246, 0.6); }
    .button.ghost { color: var(--ink); border: 1px solid var(--line); background: var(--glass); }
    .button.ghost:hover { transform: scale(1.02); border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.09); }
    .home { margin-top: 34px; font-size: 12.5px; letter-spacing: 0.06em; color: var(--faint); }
    .home a { color: var(--violet-soft); text-decoration: none; }
    .home a:hover { text-decoration: underline; }
    /* ---- auth-flow UI (shown only for /auth/... links from Supabase emails) ---- */
    #auth-ui { display: none; max-width: 420px; width: 100%; margin: auto; position: relative; z-index: 1; }
    #auth-ui h2 { margin: 0 0 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em;
                  background: var(--grad-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #auth-status { font-size: 16px; line-height: 1.55; min-height: 1.4em; margin: 0; }
    #auth-ok-btn { display: none; margin-top: 18px; padding: 13px 24px; border-radius: 999px; border: none;
                   background: linear-gradient(135deg, #8b5cf6, #5b2bb3); color: #fff; font-weight: 600;
                   text-decoration: none; font-size: 14px; cursor: pointer;
                   box-shadow: 0 8px 32px rgba(122, 77, 209, 0.4);
                   transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease); }
    #auth-ok-btn:hover { transform: scale(1.03); box-shadow: 0 10px 44px rgba(139, 92, 246, 0.6); }
    #auth-form-box { display: none; margin-top: 18px; }
    #auth-form-box input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin: 6px 0;
                           border-radius: 14px; border: 1px solid var(--line); background: var(--glass);
                           color: var(--ink); font-size: 15px; outline: none; }
    #auth-form-box input:focus { border-color: rgba(194, 150, 255, 0.6); }
    #auth-form-box input::placeholder { color: var(--faint); }
    #auth-pw-btn { margin-top: 10px; padding: 13px 24px; border-radius: 999px; border: none;
                   background: linear-gradient(135deg, #8b5cf6, #5b2bb3); color: #fff; font-weight: 600;
                   font-size: 14px; cursor: pointer; box-shadow: 0 8px 32px rgba(122, 77, 209, 0.4);
                   transition: transform 0.35s var(--ease); }
    #auth-pw-btn:hover { transform: scale(1.03); }
    #auth-pw-btn:disabled { opacity: 0.6; cursor: default; }
    #auth-pw-msg { color: #ff8f8f; font-size: 14px; min-height: 1.2em; margin: 8px 0 0; }
    .auth-foot { margin-top: 30px; font-size: 12.5px; letter-spacing: 0.06em; color: var(--faint); }
    .auth-foot strong { color: var(--muted); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

  <div class="orb two"></div>
  <main class="card" id="page-404">
    <div class="code">404</div>
    <h1>This page went off the grid.</h1>

    <div class="actions">

    <div class="home">or head straight to <a href="portfolio.html">our work</a></div>

  <!-- Auth-flow UI: shown only when handling /auth/... links from Supabase emails -->

    <a id="auth-ok-btn" href="/ref.html">Continue to sign in</a>
