<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- PallettAi brand mark: the P/ monogram, heavy weight.
       Square, 48x48. Strokes are deliberately thick so the mark still reads at
       30px in the header and at 16px in a browser tab. Replaces the old
       signal-logo.svg, which is a 720x220 wordmark and was being crushed into
       this square slot. -->
  <defs>
    <linearGradient id="pm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf5ff"/>
      <stop offset=".45" stop-color="#a9d8ff"/>
      <stop offset="1" stop-color="#7cc0f8"/>
    </linearGradient>
  </defs>
  <g stroke="url(#pm)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M14 39V10"/>
    <path d="M14 10h6.2a7.3 7.3 0 0 1 0 14.6H14"/>
    <path d="M27.5 39.8 38 9"/>
  </g>
</svg>
